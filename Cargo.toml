[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/demod",
    "crates/exec",
    "crates/fc-guest",
    "crates/hostmem",
    "crates/platform",
    "crates/runtime",
    "crates/sim",
    "crates/transport",
    "crates/workload",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
async-trait = "0.1.91"
axum = "0.8.9"
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false }
tokio = "1.53.1"
tracing = "0.1.44"
turmoil = "0.7.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
disallowed_methods = "deny"
await_holding_refcell_ref = "deny"
# Pedantic relaxations that fight the sans-IO style.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# The simulation processes millions of virtual-time events per test; the
# daemon and simulated world models run optimized even in dev/test builds.
[profile.dev.package.blockd-core]
opt-level = 2

# A panicking production daemon must fail-stop instead of leaving other
# threads running against partially unwound protocol state.
[profile.release]
panic = "abort"

[profile.dev.package.blockd-exec]
opt-level = 2

[profile.dev.package.blockd-sim]
opt-level = 2
