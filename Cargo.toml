[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/demod",
    "crates/fc-guest",
    "crates/hostmem",
    "crates/platform",
    "crates/runtime",
    "crates/sim",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
disallowed_methods = "deny"
# Pedantic relaxations that fight the sans-IO style.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# The simulation processes millions of virtual-time events per test; the
# daemon and sim kernel run optimized even in dev/test builds (pure
# integer state machines — optimization cannot change behavior, and the
# determinism suite would catch it if it somehow did).
[profile.dev.package.blockd-core]
opt-level = 2

[profile.dev.package.blockd-sim]
opt-level = 2
