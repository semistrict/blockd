[package]
name = "blockd-demod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "demod"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
blockd-core = { path = "../core" }
blockd-runtime = { path = "../runtime" }
async-trait = "0.1.91"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-http = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
prometheus = { version = "0.14.0", default-features = false, features = ["process"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = ["tracing-log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
