[package]
name = "blockd-demod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "demod"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
blockd-core = { path = "../core" }
blockd-runtime = { path = "../runtime" }
async-trait.workspace = true
base64 = "0.22.1"
axum = { workspace = true, features = ["http1", "json", "tokio"] }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-http = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
reqwest = { workspace = true, features = ["hickory-dns", "http2", "rustls"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7.0", features = ["limit", "timeout"] }
tracing.workspace = true
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = ["tracing-log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
