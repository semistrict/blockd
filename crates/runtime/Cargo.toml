[package]
name = "blockd-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Runtime lint settings allow the clocks, threads, and I/O forbidden in core.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
async-trait.workspace = true
bytes = "1.11.1"
blockd-core = { path = "../core" }
blockd-exec = { path = "../exec" }
blockd-hostmem = { path = "../hostmem" }
blockd-transport = { path = "../transport" }
axum = { workspace = true, features = ["http1", "tokio"] }
futures-util = "0.3.33"
httpdate = "1.0.3"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing.workspace = true
reqwest = { workspace = true, features = ["hickory-dns", "http2", "rustls"] }
rcgen = { version = "0.14.7", default-features = false, features = ["ring"] }
rustix = { version = "0.38.44", features = ["fs"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"

[dev-dependencies]
# The differential recovery test replays simulation-produced blob sets
# through the runtime's on-disk scan path.
blockd-sim = { path = "../sim" }
blockd-workload = { path = "../workload" }
tempfile = "3.23.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
