[package]
name = "blockd-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Not `workspace = true`: this is the nondeterministic side of the seam —
# real threads, real clocks, real I/O. The determinism bans (no threads, no
# Instant) exist to protect core/sim; here they ARE the implementation.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
async-trait.workspace = true
base64 = "0.22.1"
bytes = "1.11.1"
blockd-core = { path = "../core" }
blockd-hostmem = { path = "../hostmem" }
axum = { workspace = true, features = ["http1", "tokio"] }
futures-util = "0.3.33"
httpdate = "1.0.3"
tracing.workspace = true
reqwest = { workspace = true, features = ["hickory-dns", "http2", "rustls"] }
rustix = { version = "0.38.44", features = ["fs"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"

[dev-dependencies]
# The differential recovery test replays simulation-produced blob sets
# through the runtime's on-disk scan path.
blockd-sim = { path = "../sim" }
rcgen = { version = "0.14.7", default-features = false, features = ["ring"] }
tempfile = "3.23.0"

[target.'cfg(target_os = "linux")'.dependencies]
blockd-vsetfs = { path = "../vsetfs" }
libc.workspace = true

[[bin]]
name = "blockd-vsetfs"
path = "src/bin/blockd-vsetfs.rs"
required-features = []
