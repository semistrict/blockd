[package]
name = "blockd-fc-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Runs as PID 1 inside a Firecracker guest: raw syscalls (mount, reboot)
# need libc, and libc needs unsafe. Guest-side only.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
blockd-platform = { path = "../platform" }
libc = "0.2.189"
blockd-core = { path = "../core" }
blockd-sqlite-vfs = { path = "../sqlite-vfs" }
rusqlite = "0.40.1"
