[package]
name = "blockd-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-page-size = []

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
