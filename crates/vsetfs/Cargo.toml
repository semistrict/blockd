[package]
name = "blockd-vsetfs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blockd-core = { path = "../core" }

[target.'cfg(target_os = "linux")'.dependencies]
fuse-backend-rs = { version = "0.14.0", default-features = false, features = ["virtiofs"] }
libc = "0.2.180"
vhost = { version = "0.16.0", features = ["vhost-user-backend"] }
vhost-user-backend = "0.22.0"
virtio-queue = "0.17.0"
vm-memory = { version = "=0.17.1", features = ["backend-atomic", "backend-mmap"] }
vmm-sys-util = "0.15.0"
