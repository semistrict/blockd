[package]
name = "blockd-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-page-size = ["blockd-core/test-page-size"]

[dependencies]
blockd-core = { path = "../core", version = "0.1.0" }
blockd-exec = { path = "../exec", version = "0.1.0" }
blockd-transport = { path = "../transport", version = "0.1.0" }
blockd-workload = { path = "../workload", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
turmoil.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
