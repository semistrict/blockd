[package]
name = "blockd-hostmem"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Deliberately NOT `workspace = true`: the workspace forbids unsafe_code
# because core/sim are the deterministic seam-side. This crate is the other
# side of that seam — the real Linux memory runtime (memfd, mmap,
# userfaultfd ioctls) — and is exactly where unsafe lives, in one audited
# place.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
blockd-platform = { path = "../platform" }
libc = "0.2.189"
